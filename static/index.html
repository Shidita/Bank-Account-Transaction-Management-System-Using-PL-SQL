<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Account &amp; Transaction Management System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182a4a'/%3E%3Cpath d='M8 22V10h6a4 4 0 010 8H8m6 0a4 4 0 010 4H8' fill='none' stroke='%23f2b441' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#f2b441"/><path d="M8 22V10h6a4 4 0 010 8H8m6 0a4 4 0 010 4H8" fill="none" stroke="#182a4a" stroke-width="2.4"/></svg>
      <div><b>Bank Account &amp; Transaction Management System</b><small id="mode-label">connecting…</small></div>
    </div>
    <nav id="nav" aria-label="Main">
      <a href="#/overview" data-r="overview">Overview</a>
      <a href="#/customers" data-r="customers">Customers</a>
      <a href="#/accounts" data-r="accounts">Accounts</a>
      <a href="#/move" data-r="move">Move money</a>
      <a href="#/transactions" data-r="transactions">Transactions</a>
      <a href="#/reports" data-r="reports">Reports</a>
      <a href="#/audit" data-r="audit">Audit log</a>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main id="view" class="main" tabindex="-1"></main>

  <section class="console" id="console" aria-label="PL/SQL console">
    <button class="console-head" id="console-toggle" aria-expanded="false">
      <span>PL/SQL console</span><em id="console-count">0 calls</em>
    </button>
    <div class="console-body" id="console-log">
      <p class="console-empty">Every action you take runs a real <code>bank_pkg</code> call. The call, its DBMS_OUTPUT and any ORA-200xx error show up here.</p>
    </div>
    <button class="console-clear" id="console-clear">Clear</button>
  </section>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
